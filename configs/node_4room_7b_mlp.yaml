# MLP GENOME. chr001_evict (sigma = 0.001, chromosomal c=3, random_holder,
# refill off) with two changes: the genome now adapts the MLP as well as
# attention, and room capacity is taken from the engine instead of being
# hand-set.
#
# This is an exploration, not a controlled contrast — it moves more than one
# thing at once, deliberately, because both changes are about giving the
# population more room to work in.
#
# WHAT IS ACTUALLY DIFFERENT HERE
#
# Not "4x more parameters". The MLP does a different JOB from attention, and
# adapting it opens a class of change that attention-only evolution cannot
# reach at any size.
#
#   Attention decides ROUTING — which positions attend to which, and how
#   information moves between them. Given the attention pattern, the v/o path
#   is a linear map. Evolving q/k/v/o lets a population re-weight and re-route
#   what the base model already computes.
#
#   The MLP is where the per-position COMPUTATION happens, and where the
#   nonlinearity lives (SwiGLU across gate and up). It is also, on the
#   interpretability evidence, where much of a transformer's stored knowledge
#   and feature construction sit.
#
# So attention-only evolution can change what the model ATTENDS TO. It cannot
# change what the model COMPUTES at a position. Every run so far has been
# searching a space of re-mixings of a fixed feature set. This is the first run
# where the features themselves are heritable material.
#
# WHAT WE EXPECT TO LEARN
#
#   Does a qualitatively larger function class produce qualitatively different
#   behaviour, or just more of the same?
#     The interesting outcome is a behaviour no attention-only run produced —
#     not simply higher canonical rate or more births. Worth checking whether
#     the per-site gene-behaviour associations land preferentially on MLP
#     sites: if they do, the population is using the new material rather than
#     carrying it as dead weight.
#
#   Does heritable variation rise without touching sigma?
#     Genome spread between agents was 2.3% of their distance from the base
#     model at sigma = 0.001, and parent->child strategy concordance only
#     +0.8 pp over a same-room control. Both have been the binding constraint
#     on selection. If 196 sites give selection more to grip, both should rise.
#
#   Does a 4x adapter cost change reproduction on its own?
#     88 blocks per birth against 22. Under random_holder, hazard tracks blocks
#     held, so a room full of children is a room where everyone is closer to
#     eviction. Watch V_k (40.2 in chr001) and Ne (5.7).
#
#   Does 1.66x the usable pool change the ecology?
#     ~79,600 blocks per room instead of 48,000. At 100 agents that is 11,335
#     tokens of context each rather than ~7,000.
#
# THE RISK THAT COMES WITH THE EXPRESSIVITY
#
# sigma is per-element, so 196 sites drift independently where 112 did. The
# per-site relative perturbation is unchanged, but the total functional
# displacement per generation is larger, because it accumulates across four
# times as many parameters. The error threshold may therefore sit LOWER for
# this genome: sigma = 0.001 is comfortably below it for attention-only and
# might not be for attention plus MLP.
#
# If this run degrades in the way the sigma = 0.0025 arms did — reproduction
# falling, contexts climbing, the room_id tic sweeping — the first thing to try
# is not abandoning the MLP but lowering sigma to match the larger genome.
#
# WHAT WOULD FALSIFY IT
#
# Fewer agents per room, or lower canonical-action rate, would mean the bigger
# adapter is crowding out the context the agents actually think with. The
# check is agents/room against chr001's 60.9 and canonical rate against 93.6%.
#
run_name: node-4room-7b-mlp
seed: 0
backend: vllm

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  max_model_len: auto
  extend_context: true

world:
  # No capacity_blocks: each room takes the engine's whole measured pool minus
  # engine.safety_margin_blocks. Hand-setting 48,000 left 35,744 blocks —
  # 30.5 GB — reserved by vLLM at startup and never usable by any agent,
  # because the number had been chosen once against a context ceiling and then
  # carried forward. Derived, it is ~79,600.
  rooms:
    - {id: gpu0, gpu: 0}
    - {id: gpu1, gpu: 1}
    - {id: gpu2, gpu: 2}
    - {id: gpu3, gpu: 3}
  edges: complete
  block_size: 16
  # THE ONE CHANGE. Under `requester` the agent that asks for a block when the
  # pool is empty is the one that dies, so hazard tracks THROUGHPUT: you ask
  # once per 16 tokens, whatever you already hold. Measured consequence across
  # 51,000 deaths in chr001 and chr0025: the median dying agent held 0.63x the
  # room's mean context. Big agents were SAFER than small ones, because size
  # correlates with having drained your backlog and gone quiet.
  #
  # That is also why bloat is an externality. Holding 300,000 tokens raises
  # every agent's hazard by filling the room, but the holder bears only 1/N of
  # the harm — which is how chr0025 and uni0025 ended with two agents sitting
  # on 310,000 tokens each in a pool that was not even full, nobody dying and
  # nobody able to be born.
  #
  # `random_holder` picks the victim with probability proportional to blocks
  # held (it draws a random held block and kills its owner). Holdings stop
  # being a free store and become continuous exposure — rent expressed as
  # hazard, with no new currency, no dice outside the economy and no chosen
  # timescale. It has been in the config since the start and no run has ever
  # used it.
  eviction: random_holder
  initial_population_per_room: 32
  tools: [tell, mate, go]
  chat_format: true
  read_policy: drain
  observation_absorption: utterance
  mate_window_tokens: 64
  viability_probe_turns: 3


refill:
  # OFF. Immigration was scaffolding for getting a population off the ground,
  # and the evidence says it is no longer load-bearing: in lowmut (6071675)
  # every one of the 39 refills fired inside the first 3,500 steps of a 93,586
  # step run, gpu1 needed none at all, and thereafter the rooms sustained
  # themselves at 27-52 agents with a worst-case floor of 11. Nothing was being
  # rescued after bootstrap.
  #
  # Worse, those bootstrap refills were an artefact of the old trigger rather
  # than a need. A young room is empty of BLOCKS while being full of AGENTS --
  # contexts have not grown yet -- so max_free_fraction could not tell "dying"
  # from "just started", and put 28 fresh gen-0 genomes into gpu3 while its
  # population was peaking at 91. That is contamination of generation 0 at
  # exactly the point every later generation is measured against.
  #
  # With this off, self-sufficiency is not a statistic to be reported, it is a
  # precondition for the run existing at all: births are the ONLY source of new
  # agents after seeding. A population that cannot reproduce shrinks, and if
  # the world empties, World logs an extinction event and stops (§7) -- which
  # is a clean, interpretable negative rather than a subsidised ambiguity.
  enabled: false
  min_population: 0
  max_free_fraction: null
  check_every_steps: 500
  max_per_check: 4
  takeoff_window_steps: 20000
  takeoff_min_births: 5

# ── WHAT WE EXPECT TO LEARN ───────────────────────────────────────────────
# Whether less mutation is monotonically better below the threshold, or whether
# there is a floor past which the population starves for variation.
#
# Mutation is the ONLY source of new variation here -- there is no other
# innovation operator -- and selection erodes the additive variance it feeds on.
# lowmut already showed that erosion: phenotypic variance in canonical rate fell
# to 0.033 against 0.15 in the sigma = 0.01 arms as the mean swept to 94.7%. At
# 0.001, five matings move factor RMS only ~1.006x, so drift is essentially
# frozen and the population is working almost entirely from standing gen-0
# diversity.
#
# Expected if the threshold story is complete: this behaves like chr0025, maybe
# slightly better, since less drift is strictly less damage.
#
# Expected if variation matters: it climbs more slowly than chr0025, or plateaus
# at a lower canonical rate, or shows a heritability that collapses earlier as
# the trait fixes. Any of those brackets the useful range from BELOW and means
# there is an optimum sigma rather than a threshold to stay under.

genome:
  rank: 16
  alpha: 32
  # All seven projections. The MLP is where most of the computation happens
  # and it has never been adapted: every run so far mutated attention only,
  # 112 sites of 10.1M parameters. With gate/up/down it is 196 sites and
  # 40.4M parameters — 4x the genome.
  #
  # Two reasons beyond expressiveness. The adapter grows 20 MB -> 77 MB, i.e.
  # 22 -> 88 blocks per agent, so a birth removes four times as much real
  # memory from the pool and reproduction acquires a genuine cost without any
  # invented tax. And genome diversity has been tiny — agents differ by 2.3%
  # of their distance from the base model at sigma = 0.001 — so more adapted
  # parameters is a way to get heritable variation without raising sigma.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  init_scale: 0.02
  mutation_std: 0.001
  crossover: chromosomal
  chromosomes: 3
  mutation: additive
engine:
  # lowmut and chromo were both aborted by the preemption guard after a single
  # transient allocation failure (the counter is cumulative, and any preemption
  # is an integrity violation by design). The economy still claims 48,000
  # blocks per room -- unchanged, so these stay comparable to 6071675 -- but
  # the pool underneath is grown from 75,962 blocks to give the scheduler more
  # absolute slack for prefill bursts in the dense, fast-turnover regime that
  # low mutation produces. safety_margin_blocks documents intent; it does not
  # bind while capacity_blocks is explicit.
  gpu_memory_utilization: 0.92
  max_loras: 8
  # Rooms now hold far more agents, so the CPU-side adapter cache has to hold
  # them: 256 x 20.2 MB is ~5 GB of host RAM.
  # 77 MB per adapter now, not 20. Four rooms x 128 adapters = 38.5 GB of the
  # node's 460 GB, and a room's population has never exceeded ~110.
  max_cpu_loras: 128
  max_num_seqs: 128
  enable_prefix_caching: true
  enable_chunked_prefill: true
  safety_margin_blocks: 4096
  adapter_dir: /dev/shm/evollm

sampling:
  temperature: 1.0
  top_p: 1.0

run:
  max_world_steps: 400000
  # Genotype capture. The important part is the INHERITANCE MASK.
  #
  #   genome_fingerprints  writes one line per agent at creation to
  #     <run>/genomes/<room>.jsonl. For a child it records `donors`: one bit
  #     per site saying which parent supplied it — 112 bits, the actual act of
  #     inheritance. Without it, descent can only be estimated by the expected
  #     one-half rule, which is an average over births that never happened.
  #     With it, descent is resolvable site by site back to the founder that
  #     really contributed each one, which turns every site into a categorical
  #     ALLELE that can be tested against behaviour directly. That is a marker
  #     test with far more power than correlating a site's perturbation
  #     magnitude with a trait — which is all snapshots alone could support,
  #     and which produced no replicable hit in lowmut.
  #
  #     The same line also carries per-site magnitude summaries (delta_norm,
  #     rms_a, rms_b). Cost is ~5.5 KB and ~17 ms per agent: ~70 MB and about
  #     3 minutes over a 12,000-birth run.
  #
  #   snapshot_every_steps  full 40 MB genomes for the living, for work that
  #     needs the actual factors rather than per-site summaries. Raised from
  #     40,000 to 25,000 (~16 per room, ~32 GB). Full coverage is the
  #     per-agent records' job now, not the snapshots'.
  genome_fingerprints: true
  snapshot_every_steps: 25000
  occupancy_every_steps: 1000
  trace_turns: 20000
  # Trace whole lives of a random tenth of agents rather than the first turns
  # the room happens to produce. The plain budget filled up in the opening of
  # the run, so every traced life was a founder's prefix and within-lifetime
  # questions could not be asked of it. Same volume, whole lives, spread over
  # the run.
  trace_agent_fraction: 0.10
  # Score the tokens the WORLD writes into each agent's context, bucketed by
  # position in the agent's own life. Enabled across the queued arms so
  # surprise is measured under four different treatments at once rather than
  # in one dedicated arm. The GPU path is unproven, so the engine probes it at
  # startup and disables surprise -- not the run -- if it does not work.
  record_surprise: true
  context_snapshot_every_steps: 25000
  context_snapshot_agents: 3
