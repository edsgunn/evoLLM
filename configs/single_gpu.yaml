# One room, one GH200 GPU: the first real-run shape. No movement (a one-room
# graph has no edges), which isolates the block economy + handshake dynamics
# from migration. capacity_blocks is derived from the engine's measured KV
# pool minus safety_margin_blocks (§4.2).
run_name: single-gpu
seed: 0
backend: vllm

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  dtype: bfloat16
  max_model_len: 8192

world:
  rooms:
    - {id: gpu0, gpu: 0}
  edges: complete
  block_size: 16
  eviction: requester
  initial_population_per_room: 16
  max_action_tokens: 128
  mate_window_tokens: 64
  viability_probe_turns: 3

genome:
  rank: 16
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  init_scale: 0.02
  mutation_std: 0.01

engine:
  gpu_memory_utilization: 0.85
  max_loras: 8            # GPU-resident working set; measure before raising N (§4.1)
  max_cpu_loras: 128
  max_num_seqs: 64
  enable_prefix_caching: true
  enable_chunked_prefill: true
  safety_margin_blocks: 128
  adapter_dir: /dev/shm/evollm

sampling:
  temperature: 1.0
  top_p: 1.0

run:
  max_world_steps: 200000
  snapshot_every_steps: 10000
  occupancy_every_steps: 1000
