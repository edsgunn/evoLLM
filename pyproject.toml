# =============================================================================
# Isambard note (same policy as MARLLLM): the GPU venv is built by
# slurm/install_env.sh following the Isambard vLLM tutorial recipe
# (torch+cu129, vllm[flashinfer]==0.15.1). vLLM is deliberately NOT a declared
# dependency here, because uv must never try to resolve it.
#
# DO NOT run `uv sync` OR `uv run` in this directory without setting
# UV_PROJECT_ENVIRONMENT first. Both commands sync uv's default project
# environment, which is ./.venv — the GPU venv. That silently re-resolves
# declared dependencies inside it; it is how numpy was once upgraded to 2.5,
# breaking numba and with it every engine start.
#
# Login-node work uses a separate environment:
#     export UV_PROJECT_ENVIRONMENT=.venv-dev
#     uv sync && uv run pytest
# or just `./dev.sh pytest`, which sets it for you.
#
# To change the GPU venv, use `uv pip install --python .venv/bin/python <pkg>`,
# which touches only what you name, or re-run slurm/install_env.sh.
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evollm"
version = "0.1.0"
description = "Gradient-free evolution as a substrate for in-context surprise minimisation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Upper bound is not cosmetic: vLLM imports numba, and numba requires
    # numpy<2.3. An unpinned numpy resolves to 2.5 and breaks engine startup
    # with "Numba needs NumPy 2.2 or less" — a failure that only shows up on
    # the GPU, long after the install looked fine.
    "numpy>=1.26,<2.3",
    "pyyaml>=6.0",
    "safetensors>=0.4",
]

[project.scripts]
evollm = "evollm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evollm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
